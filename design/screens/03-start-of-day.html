<div style="width: 1180px; height: 820px; box-sizing: border-box; background: #F4F6F5; color: #142121; font-family: Inter, 'Noto Sans Devanagari', system-ui, sans-serif; display: flex; flex-direction: column">

<div style="display: flex; flex-direction: column">
<span style="font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 17px; line-height: 1.1">Sharma Family Clinic</span>
<span style="font-size: 12px; color: #5B6B6A">Thu, 29 Oct · Morning session</span>
</div>
</div>
<div style="display: flex; gap: 8px; flex: 1 1 0; justify-content: center">
<div style="display: flex; flex-direction: column; padding: 6px 14px; border-radius: 12px; background: #F4F6F5"><span style="font-size: 11px; color: #5B6B6A">In queue</span><span style="font-weight: 700; font-size: 18px">0</span></div>
<div style="display: flex; flex-direction: column; padding: 6px 14px; border-radius: 12px; background: #F4F6F5"><span style="font-size: 11px; color: #5B6B6A">Served today</span><span style="font-weight: 700; font-size: 18px">0</span></div>
<div style="display: flex; flex-direction: column; padding: 6px 14px; border-radius: 12px; background: #F4F6F5"><span style="font-size: 11px; color: #5B6B6A">Avg consult</span><span style="font-weight: 700; font-size: 18px; color: #5B6B6A">6 min <span style="font-size: 11px; font-weight: 500">default</span></span></div>
</div>
<button style="height: 48px; padding: 0 18px; border: 0; border-radius: 14px; background: #0E7C7B; color: #FFFFFF; font: 600 15px Inter, sans-serif; display: flex; align-items: center; gap: 8px">
<svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
Add walk-in
</button>
</header>

<nav aria-label="Doctors" style="display: flex; align-items: center; gap: 10px; padding: 14px 20px 0">
<button aria-pressed="true" style="height: 56px; padding: 0 18px; border: 2px solid #0E7C7B; border-radius: 16px; background: #FFFFFF; color: #142121; font: 600 16px Inter, sans-serif; display: flex; align-items: center; gap: 12px">
<span style="width: 32px; height: 32px; border-radius: 10px; background: #0E7C7B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font: 800 16px 'Baloo 2', sans-serif">A</span>
Dr. Anita Sharma
</button>
<button aria-pressed="false" style="height: 56px; padding: 0 18px; border: 1px solid #DCE3E2; border-radius: 16px; background: #FFFFFF; color: #142121; font: 500 16px Inter, sans-serif; display: flex; align-items: center; gap: 12px">
<span style="width: 32px; height: 32px; border-radius: 10px; background: #E6F2F1; color: #0A5958; display: flex; align-items: center; justify-content: center; font: 800 16px 'Baloo 2', sans-serif">B</span>
Dr. Rohit Verma
<span style="padding: 3px 10px; border-radius: 999px; background: #F2F5F4; color: #5B6B6A; font-size: 13px">Starts 11:00 AM</span>
</button>
</nav>

<div style="flex: 1 1 auto; display: flex; gap: 16px; padding: 14px 20px 20px">
<section aria-label="Current patient" style="width: 360px; flex: 0 0 auto; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 20px; border-radius: 20px; background: #FFFFFF; border: 1px solid #DCE3E2">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5B6B6A">With doctor now</span>
<span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 64px; line-height: 1; color: #C9D3D2">A-00</span>
<span style="font-size: 14px; color: #5B6B6A">Nobody yet. First token today will be A-01.</span>
</div>
<button disabled="" style="flex: 1 1 auto; min-height: 220px; border: 2px dashed #C9D3D2; border-radius: 24px; background: #FFFFFF; color: #7A8A89; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
<span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 36px; line-height: 1">Next patient</span>
<span style="font-size: 15px">Turns on when someone joins</span>
</button>
</section>

<section aria-label="Up next" style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; border-radius: 20px; background: #FFFFFF; border: 1px solid #DCE3E2; padding: 40px; text-align: center">
<svg width="120" height="120" sc-camel-view-box="0 0 128 128" aria-hidden="true"><path d="M30,16 H98 A22,22 0 0 1 120,38 V52 A12,12 0 0 0 120,76 V90 A22,22 0 0 1 98,112 H30 A22,22 0 0 1 8,90 V76 A12,12 0 0 0 8,52 V38 A22,22 0 0 1 30,16 Z" fill="#E6F2F1"></path><circle cx="38" cy="64" r="6" fill="#B9D9D7"></circle><circle cx="60" cy="64" r="6" fill="#B9D9D7"></circle><circle cx="88" cy="64" r="13" fill="#B9D9D7"></circle></svg>
<div style="display: flex; flex-direction: column; gap: 8px; max-width: 420px">
<h2 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 28px">Fresh queue for today</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.55; color: #5B6B6A">Patients who scan the QR poster show up here on their own. Yesterday's queue was cleared at midnight.</p>
</div>
<div style="display: flex; gap: 10px">
<button style="height: 52px; padding: 0 20px; border: 1px solid #C9D3D2; border-radius: 14px; background: #FFFFFF; color: #142121; font: 600 15px Inter, sans-serif; display: flex; align-items: center; gap: 8px">
<svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><path d="M14 14h3v3M21 14v7h-4M14 21v-3"></path></svg>
Print QR poster
</button>
<button style="height: 52px; padding: 0 20px; border: 1px solid #C9D3D2; border-radius: 14px; background: #FFFFFF; color: #142121; font: 600 15px Inter, sans-serif; display: flex; align-items: center; gap: 8px">
<svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="13" rx="2"></rect><path d="M8 21h8"></path></svg>
Open TV display
</button>
</div>
</section>
</div>
</div>
